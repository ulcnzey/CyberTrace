<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberTrace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141820'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%239fd4cb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <a class="brand" href="#overview">
        <span class="mark" aria-hidden="true"></span>
        <span>CyberTrace</span>
      </a>
      <nav id="nav" aria-label="Primary">
        <a href="#overview" data-route="overview">Overview</a>
        <a href="#live" data-route="live">Live Monitoring</a>
        <a href="#pcap" data-route="pcap">PCAP Analysis</a>
        <a href="#alerts" data-route="alerts">Alerts</a>
        <a href="#hosts" data-route="hosts">Hosts</a>
        <a href="#iocs" data-route="iocs">IOCs</a>
        <a href="#timeline" data-route="timeline">Timeline</a>
        <a href="#reports" data-route="reports">Reports</a>
        <a href="#settings" data-route="settings">Settings</a>
      </nav>
      <p class="nav-note">Authorized educational analysis. No packet injection.</p>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="health" id="health"><span class="dot"></span><span>Checking service</span></div>
        <label class="session-picker">
          <span>Analysis</span>
          <select id="session-select" aria-label="Selected analysis">
            <option value="">No analysis yet</option>
          </select>
        </label>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>

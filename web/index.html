<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberTrace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b14'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%233ee0ff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css?v=10">
</head>
<body>
  <div class="scrim" id="scrim" hidden></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M16 3.5v5.2M16 23.3V28.5M3.5 16h5.2M23.3 16H28.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
        <span class="brand-name">
          <strong>CyberTrace</strong>
          <small data-i18n="brand.product">Network security</small>
        </span>
      </a>
      <nav id="nav" data-i18n-aria="nav.primary" aria-label="Primary">
        <a href="#overview" data-route="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg><span class="label" data-i18n="nav.overview">Overview</span></a>
        <a href="#live" data-route="live"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14c2.2-4 4-4 6.2 0s4 4 6.2 0 4-4 6.2 0"></path><circle cx="18" cy="6" r="2"></circle></svg><span class="label" data-i18n="nav.live">Live Monitoring</span></a>
        <a href="#pcap" data-route="pcap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z"></path><path d="M14 3.8V9h5"></path></svg><span class="label" data-i18n="nav.pcap">PCAP Analysis</span></a>
        <a href="#alerts" data-route="alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V10a6 6 0 1 1 12 0v6.5l1.5 1.5H4.5L6 16.5z"></path><path d="M10 19.5a2 2 0 0 0 4 0"></path></svg><span class="label" data-i18n="nav.alerts">Alerts</span></a>
        <a href="#hosts" data-route="hosts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1.5"></rect><rect x="4" y="14" width="16" height="6" rx="1.5"></rect><circle cx="8" cy="7" r=".8" fill="currentColor" stroke="none"></circle><circle cx="8" cy="17" r=".8" fill="currentColor" stroke="none"></circle></svg><span class="label" data-i18n="nav.hosts">Hosts</span></a>
        <a href="#iocs" data-route="iocs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M12 3.5V6M12 18v2.5M3.5 12H6M18 12h2.5"></path></svg><span class="label" data-i18n="nav.iocs">IOCs</span></a>
        <a href="#timeline" data-route="timeline"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><path d="M12 8v4.5l3 2"></path></svg><span class="label" data-i18n="nav.timeline">Timeline</span></a>
        <a href="#reports" data-route="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"></path><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"></path></svg><span class="label" data-i18n="nav.reports">Reports</span></a>
        <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18"></path></svg><span class="label" data-i18n="nav.settings">Settings</span></a>
      </nav>
      <div class="side-foot">
        <p class="nav-note" data-i18n="nav.note">Authorized analysis. No packet injection.</p>
        <button class="collapse" id="nav-toggle" type="button" data-i18n-aria="nav.collapse" aria-label="Collapse navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6 8 12l6 6"></path></svg>
        </button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" data-i18n-aria="nav.open" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
        <div class="op" id="health"><span class="pulse"></span><span data-i18n="status.checking">CHECKING</span></div>
        <div class="session-chip" id="session-chip" data-i18n="session.none">No analysis loaded</div>
        <label class="lang-picker">
          <span class="visually-hidden" data-i18n="common.language">Language</span>
          <select id="lang-select" data-lang data-i18n-aria="common.language" aria-label="Language">
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="en">🇬🇧 English</option>
            <option value="ar">🇸🇦 العربية</option>
          </select>
        </label>
        <label class="session-picker">
          <span data-i18n="session.label">Analysis</span>
          <select id="session-select" data-i18n-aria="session.label" aria-label="Selected analysis">
            <option value="">No analysis loaded</option>
          </select>
        </label>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="drawer" id="drawer" hidden>
    <button class="drawer-backdrop" type="button" data-close data-i18n-aria="common.close" aria-label="Close details"></button>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header>
        <h2 id="drawer-title" data-i18n="common.details">Details</h2>
        <button class="icon-button" type="button" data-close data-i18n-aria="common.close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <div id="drawer-body"></div>
    </aside>
  </div>
  <script type="module" src="/static/js/app.js?v=10"></script>
</body>
</html>
